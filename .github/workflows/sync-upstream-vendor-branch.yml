name: Sync Upstream Stable Into Vendor Branch

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to mirror into the vendor branch
        required: false
        default: stable
      vendor_branch:
        description: Vendor mirror branch maintained in this repository
        required: false
        default: vendor/ckeditor5

permissions:
  contents: write

jobs:
  sync-vendor-branch:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'stable' }}
      VENDOR_BRANCH: ${{ github.event.inputs.vendor_branch || 'vendor/ckeditor5' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure upstream remote exists
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/ckeditor/ckeditor5.git
          else
            git remote add upstream https://github.com/ckeditor/ckeditor5.git
          fi

      - name: Mirror upstream into vendor branch
        shell: pwsh
        run: |
          ./scripts/sync-fork.ps1 -UpstreamRemote upstream -UpstreamBranch "$env:UPSTREAM_BRANCH" -VendorBranch "$env:VENDOR_BRANCH" -Push
